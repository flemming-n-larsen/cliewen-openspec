schemas:
  cliewen-delivery:
    status: implemented
    developmentProfile: codex-cli-primary
    developmentScenario: csv-bom-tdd
    releaseVariantProfile: codex-cli-primary
    releaseProfiles: [ codex-cli-primary, claude-code-primary, opencode-2-2-5 ]
    releaseScenarios: [ csv-bom-tdd, csv-bom-flexible, csv-bom-final-tests ]
  cliewen-discovery:
    status: implemented
    developmentProfile: codex-cli-primary
    developmentScenario: csv-streaming-investigation
    releaseVariantProfile: codex-cli-primary
    releaseProfiles: [ codex-cli-primary, claude-code-primary, opencode-2-2-5 ]
    releaseScenarios:
      [
        csv-streaming-investigation,
        discovery-no-change,
        discovery-delivery-handoff
      ]
  cliewen-all:
    status: implemented
    developmentProfile: codex-cli-primary
    developmentScenario: combined-investigation-and-delivery
    releaseVariantProfile: codex-cli-primary
    releaseProfiles: [ codex-cli-primary, claude-code-primary, opencode-2-2-5 ]
    releaseScenarios: [ combined-investigation-and-delivery, combined-no-delivery ]
